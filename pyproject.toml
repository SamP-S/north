[project]
name = "north"
version = "0.1.0"
description = "North — an in-repo Markdown task board CLI with an optional MCP server."
requires-python = ">=3.12"
dependencies = [
    "python-frontmatter",
    "pyyaml",
    "gitpython",
    "pydantic-settings",
    "python-dotenv",
    "fastapi",
    "uvicorn[standard]",
    "mcp",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-asyncio",
]

[project.scripts]
north = "north.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["north"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["docs/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

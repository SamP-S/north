[tool.uv.workspace]
members = ["aurora", "borealis", "north"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["docs/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

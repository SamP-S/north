[project]
name = "north"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aurora",
    "borealis",
    "httpx",
]

[tool.uv.sources]
aurora = { workspace = true }
borealis = { workspace = true }

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-asyncio",
]

[project.scripts]
north = "north.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["north"]

[project]
name = "borealis"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-frontmatter",
    "gitpython",
    "pydantic",
    "pydantic-settings",
    "httpx",
    "python-dotenv",
    "sse-starlette",
    "pyyaml",
    "mcp",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-asyncio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["borealis"]
